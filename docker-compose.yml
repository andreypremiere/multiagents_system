services:
  multiagents:
    image: postgres:18.2-alpine3.23
    container_name: multiagents
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${USER_AGENT}
      POSTGRES_PASSWORD: ${AGENT_PASSWORD}
    ports:
      - "5442:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d multi_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_postgres_data: